<!DOCTYPE html> 
<html> 
<head> 
  <meta charset = "utf-8"> 
  <title>Registration Page</title> 
  <!--The reference to the external stylesheet that we created to organize the pages--> 
  <link rel = "stylesheet" type = "text/css" href = "../../CSS/Style.css">
</head> 
<body> 
  <header>SEU E-Library System</header> 
  <h2>Create New Account</h2> 
  <!--The required information from the user to be entered to complete the registration using the 
post method--> 
  <form method = "post" action = "../../PHP + MySQL/register.php" onsubmit = "return checkRegister();">
    <label>Full Name:</label> 
    <input type = "text" id = "name" class = "textInput" name = "name"><br><br>

    <label>Email:</label>
    <input type = "email" id = "email" class = "textInput" name = "email"><br><br>

    <label>Password:</label>
    <input type = "password" id = "password" class = "textInput" name = "password"><br><br>

    <label>Confirm Password:</label>
    <input type = "password" id = "password2" class = "textInput" name = "confirm_password"><br><br>
<!--This is the register button to be clicked by the user to sign up--> 
<input type = "submit" class = "submitButton" value = "Sign Up"> 
</form> 
<p>Already have an account? <a href = "login.html">Login</a></p>

</body> 
</html>
